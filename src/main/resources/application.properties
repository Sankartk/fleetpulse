# =============================================================
# FleetPulse — Application Configuration (H2 in-memory default)
# Run with: mvn spring-boot:run
# Swagger UI: http://localhost:8080/swagger-ui.html
# H2 Console:  http://localhost:8080/h2-console
# =============================================================

spring.application.name=fleetpulse

# --------------- Datasource (H2 in-memory) -------------------
spring.datasource.url=jdbc:h2:mem:fleetpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --------------- JPA / Hibernate -----------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --------------- H2 Web Console ------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --------------- Flyway Migrations ---------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --------------- Server --------------------------------------
server.port=8080

# --------------- OpenAPI / Swagger UI ------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --------------- Actuator ------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=FleetPulse
info.app.version=1.0.0
info.app.description=Fleet Operations & Predictive Maintenance Platform

# --------------- Logging -------------------------------------
logging.level.com.fleetpulse=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# --------------- Scheduler -----------------------------------
fleetpulse.scheduler.overdue-check-ms=3600000
