# =============================================================
# FleetPulse — PostgreSQL Profile
# Activate with: -Dspring.profiles.active=postgres
# Or: export SPRING_PROFILES_ACTIVE=postgres
# =============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/fleetpulse
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=fleetpulse_user
spring.datasource.password=fleetpulse_pass

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.h2.console.enabled=false
spring.flyway.enabled=true
