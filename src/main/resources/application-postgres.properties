# =============================================================
# FleetPulse — PostgreSQL Profile
# Activate with: -Dspring.profiles.active=postgres
# Or: export SPRING_PROFILES_ACTIVE=postgres
# =============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleetpulse}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:fleetpulse_user}
spring.datasource.password=${DB_PASSWORD:fleetpulse_pass}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.h2.console.enabled=false
spring.flyway.enabled=true
